name: HNHost 自动续期

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 安装 sing-box
        run: |
          curl -sL "https://github.com/SagerNet/sing-box/releases/download/v1.13.19/sing-box-1.13.19-linux-amd64.tar.gz" -o /tmp/sb.tar.gz
          tar -xzf /tmp/sb.tar.gz -C /tmp --strip-components=1 sing-box-1.13.19-linux-amd64/sing-box
          chmod +x /tmp/sing-box
          /tmp/sing-box version | head -1

      - name: 启动 Hysteria2 代理
        run: |
          cat > /tmp/sb-config.json << 'EOF'
          {"log":{"level":"info"},"inbounds":[{"type":"socks","listen":"127.0.0.1","listen_port":1080}],"outbounds":[{"type":"hysteria2","server":"168.107.22.153","server_port":41706,"password":"6d126f82-f51f-4bdb-91ec-3a2a9cf84306","tls":{"enabled":true,"server_name":"www.bing.com","insecure":true}}]}
          EOF
          nohup /tmp/sing-box run -c /tmp/sb-config.json > /tmp/sb.log 2>&1 &
          sleep 5
          echo "=== proxy test ==="
          curl -s --socks5-hostname 127.0.0.1:1080 https://httpbin.org/ip --max-time 15 || echo "proxy failed"

      - name: 执行续期
        env:
          DISCORD_TOKENS: ${{ secrets.DISCORD_TOKENS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PROXY_PORT: "1080"
        run: python hnhost_renew.py

      - name: 清理旧工作日志
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          THIS_RUN="${{ github.run_id }}"
          gh run list --workflow "hnhost.yml" --limit 50 --json databaseId \
            --jq ".[].databaseId" \
            | grep -v "^${THIS_RUN}$" \
            | while read id; do
                gh run delete "$id" 2>/dev/null || true
              done
          echo "✅ 已清理"

name: HNHost 自动续期

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 安装 sing-box
        run: |
          curl -sL "https://github.com/SagerNet/sing-box/releases/download/v1.13.19/sing-box-1.13.19-linux-amd64.tar.gz" -o /tmp/sb.tar.gz
          tar -xzf /tmp/sb.tar.gz -C /tmp --strip-components=1 sing-box-1.13.19-linux-amd64/sing-box
          chmod +x /tmp/sing-box
          /tmp/sing-box version | head -1

      - name: 启动 Hysteria2 代理
        run: |
          cat > /tmp/sb-config.json << 'EOF'
          {"log":{"level":"info"},"inbounds":[{"type":"socks","listen":"127.0.0.1","listen_port":1080}],"outbounds":[{"type":"hysteria2","server":"168.107.22.153","server_port":41706,"password":"6d126f82-f51f-4bdb-91ec-3a2a9cf84306","tls":{"enabled":true,"server_name":"www.bing.com","insecure":true}}]}
          EOF
          nohup /tmp/sing-box run -c /tmp/sb-config.json > /tmp/sb.log 2>&1 &
          sleep 5
          echo "=== proxy test ==="
          curl -s --socks5-hostname 127.0.0.1:1080 https://httpbin.org/ip --max-time 15 || echo "proxy failed"

      - name: 执行续期
        env:
          DISCORD_TOKENS: ${{ secrets.DISCORD_TOKENS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PROXY_PORT: "1080"
        run: python hnhost_renew.py

      - name: 清理旧工作流运行记录（仅保留当前 run）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          THIS_RUN="${{ github.run_id }}"

          # 通过 API 拉取所有 run（分页直到全部拿完）
          DELETED=0
          KEPT=0
          PAGE=1
          while true; do
            IDS=$(gh api "repos/$REPO/actions/runs?per_page=100&page=$PAGE" \
                    --jq '.workflow_runs[].id' 2>/dev/null)
            [ -z "$IDS" ] && break
            for id in $IDS; do
              if [ "$id" = "$THIS_RUN" ]; then
                KEPT=$((KEPT + 1))
                echo "保留: $id"
              else
                if gh api "repos/$REPO/actions/runs/$id" -X DELETE >/dev/null 2>&1; then
                  DELETED=$((DELETED + 1))
                else
                  echo "删除失败（可能仍在运行）: $id"
                fi
              fi
            done
            PAGE=$((PAGE + 1))
            # 安全限制：最多翻 10 页（1000 条）
            [ $PAGE -gt 10 ] && break
          done

          echo "✅ 清理完成: 保留 $KEPT 条，删除 $DELETED 条"
